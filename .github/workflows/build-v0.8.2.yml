name: Build v0.8.2

on:
  push:
    branches:
      - release/v0.8.2-aligned-oil-tank

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.8.2-aligned-oil-tank
          fetch-depth: 0

      - name: Build aligned v0.8.2
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          src_path = Path('lovelace-boiler-card-v0.8.1.js')
          if not src_path.exists():
              raise SystemExit('lovelace-boiler-card-v0.8.1.js not found')

          src = src_path.read_text(encoding='utf-8')
          override = r'''

/*
 * Lovelace Boiler Card v0.8.2
 * Oil tank layering/alignment correction.
 * Visual order, front to back: rectangular gauge, suction tube,
 * grey tank outline, solid red tank body.
 * Only the rectangular gauge remains dynamic.
 */
(() => {
  const BoilerCardClass = customElements.get("lovelace-boiler-card");
  if (!BoilerCardClass) {
    throw new Error("lovelace-boiler-card: v0.8.1 base did not register the card");
  }

  const SVG_NS_V082 = "http://www.w3.org/2000/svg";
  const TANK_D_V082 = "M66 462 V452 C66 423 91 401 123 401 H247 C279 401 304 423 304 454 V678 C304 713 279 739 247 739 H123 C91 739 66 713 66 680 Z";
  const TUBE_D_V082 = "M190 401 V748 M179 748 H201";
  const previousOilUpdateV082 = BoilerCardClass.prototype._updateOilFill;

  const ensureV082TankLayers = function () {
    const group = this.shadowRoot?.getElementById("obj-oil-level");
    if (!group) return;

    // The v0.8.1 clipped rectangle is intentionally retained but hidden so the
    // previous renderer does not recreate it on every Home Assistant state update.
    const oldStaticTank = group.querySelector("#oil-static-tank-v081");
    if (oldStaticTank) oldStaticTank.style.display = "none";

    let redBody = group.querySelector("#oil-static-tank-v082");
    if (!redBody) {
      redBody = document.createElementNS(SVG_NS_V082, "path");
      redBody.setAttribute("id", "oil-static-tank-v082");
      redBody.setAttribute("d", TANK_D_V082);
      redBody.setAttribute("fill", "#9d001f");
      redBody.setAttribute("stroke", "none");
      redBody.setAttribute("pointer-events", "none");
      group.appendChild(redBody);
    }

    let greyOutline = group.querySelector("#oil-tank-outline-v082");
    if (!greyOutline) {
      greyOutline = document.createElementNS(SVG_NS_V082, "path");
      greyOutline.setAttribute("id", "oil-tank-outline-v082");
      greyOutline.setAttribute("d", TANK_D_V082);
      greyOutline.setAttribute("fill", "none");
      greyOutline.setAttribute("stroke", "var(--bc-metal-light, #bdbdbd)");
      greyOutline.setAttribute("stroke-width", "9");
      greyOutline.setAttribute("stroke-linejoin", "round");
      greyOutline.setAttribute("stroke-linecap", "round");
      greyOutline.setAttribute("pointer-events", "none");
      group.appendChild(greyOutline);
    }

    const tube = Array.from(group.querySelectorAll("path")).find(
      (el) => el.getAttribute("d") === TUBE_D_V082
    );
    const gauge = group.querySelector("#oil-rect-gauge-v081");

    // Establish the requested SVG painter order exactly once:
    // red body -> grey outline -> yellow tube -> rectangular gauge.
    if (group.dataset.v082Layered !== "1" && redBody && greyOutline && tube && gauge) {
      group.appendChild(redBody);
      group.appendChild(greyOutline);
      group.appendChild(tube);
      group.appendChild(gauge);
      group.dataset.v082Layered = "1";
    }
  };

  BoilerCardClass.prototype._updateOilFill = function () {
    // Keep the accepted v0.8.1 rectangular gauge calculation unchanged.
    previousOilUpdateV082.call(this);
    ensureV082TankLayers.call(this);
  };

  if (Array.isArray(window.customCards)) {
    const entry = window.customCards.find((card) => card.type === "lovelace-boiler-card");
    if (entry) {
      entry.description = "Oil boiler + radiator circuit + DHW tank. v0.8.2 aligned tank + rectangular oil gauge";
    }
  }
})();
'''

          out = src + override
          Path('lovelace-boiler-card-v0.8.2.js').write_text(out, encoding='utf-8')

          hacs = Path('hacs.json')
          if hacs.exists():
              data = json.loads(hacs.read_text(encoding='utf-8'))
              data['filename'] = 'lovelace-boiler-card-v0.8.2.js'
              hacs.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          readme = Path('README.md')
          if readme.exists():
              text = readme.read_text(encoding='utf-8')
              text = re.sub(r'\*\*Current version: [^*]+\*\*', '**Current version: 0.8.2**', text, count=1)
              text = text.replace('lovelace-boiler-card-v0.8.1.js', 'lovelace-boiler-card-v0.8.2.js')
              if '## v0.8.2 aligned oil tank' not in text:
                  text += '\n\n## v0.8.2 aligned oil tank\n\n- keeps the v0.8.1 rectangular gauge and its dynamic level unchanged;\n- replaces the clipped static tank rectangle with a red path using exactly the tank outline geometry;\n- enforces visual order: gauge, suction tube, grey outline, red tank body;\n- keeps all non-oil-tank visuals unchanged.\n'
              readme.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          if changelog.exists():
              text = changelog.read_text(encoding='utf-8')
              if not text.startswith('## 0.8.2'):
                  entry = '''## 0.8.2\n\n- Aligns the static red oil-tank body exactly to the tank geometry.\n- Uses one identical SVG path for the red body and grey outline.\n- Enforces front-to-back order: rectangular gauge, suction tube, grey outline, red body.\n- Leaves the v0.8.1 rectangular gauge calculation and all other card visuals unchanged.\n\n'''
                  changelog.write_text(entry + text, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: node --check lovelace-boiler-card-v0.8.2.js

      - name: Commit generated release and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/build-v0.8.2.yml
          git add lovelace-boiler-card-v0.8.2.js hacs.json README.md CHANGELOG.md
          git commit -m "Build v0.8.2 aligned oil tank"
          git push origin HEAD:release/v0.8.2-aligned-oil-tank
