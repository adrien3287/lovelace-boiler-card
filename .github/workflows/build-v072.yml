name: Build v0.7.2 oil-volume tank level

on:
  push:
    branches:
      - release/v0.7.2-oil-volume-level
    paths:
      - '.github/workflows/build-v072.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.7.2-oil-volume-level
          fetch-depth: 0

      - name: Build standalone v0.7.2
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess

          base_path = Path('lovelace-boiler-card-v0.7.1.js')
          out_path = Path('lovelace-boiler-card-v0.7.2.js')
          readme_path = Path('README.md')

          base = base_path.read_text(encoding='utf-8')
          old_header = '''/*
           * Lovelace Boiler Card v0.7.1
           * Single-file repackaging of validated v0.6.15 behavior.
           * No runtime imports or external JS/SVG/image dependencies.
           */'''
          new_header = '''/*
           * Lovelace Boiler Card v0.7.2
           * Standalone v0.7.1 runtime with dynamic oil-volume rendering.
           * The visible tank level is driven by oil_volume (sensor.niveau_fioul in the example).
           * No runtime imports or external JS/SVG/image dependencies.
           */'''
          if old_header not in base:
              raise SystemExit('Expected v0.7.1 header not found')
          base = base.replace(old_header, new_header, 1)

          version_old = 'const BOILER_CARD_VERSION = "0.7.1";'
          version_new = 'const BOILER_CARD_VERSION = "0.7.2";'
          if version_old not in base:
              raise SystemExit('Expected BOILER_CARD_VERSION 0.7.1 not found')
          base = base.replace(version_old, version_new, 1)

          wrapper = subprocess.check_output(
              ['git', 'show', '170ab12d9f101a2d43abc98b6ac944477dc6a6b6:lovelace-boiler-card-v0.6.16.js'],
              text=True,
          )
          wrapper = wrapper.replace('import "./lovelace-boiler-card.js";', '', 1)
          wrapper = wrapper.replace('Lovelace Boiler Card v0.6.16', 'Lovelace Boiler Card v0.7.2', 1)
          wrapper = wrapper.replace('oil_height_percent, while', 'oil_volume, while', 1)
          wrapper = wrapper.replace('#oil-fill-v016', '#oil-fill-v072')
          wrapper = wrapper.replace('renderOilLevelV016', 'renderOilLevelV072')
          wrapper = wrapper.replace(
              'throw new Error("lovelace-boiler-card: base module did not register the card");',
              'throw new Error("lovelace-boiler-card v0.7.2: embedded base module did not register the card");',
              1,
          )
          wrapper = wrapper.replace(
              'entry.description = "Oil boiler + radiator circuit + DHW tank in one SVG card. v0.6.16 (clean dynamic oil level)";',
              'entry.description = "Oil boiler + radiator circuit + DHW tank in one SVG card. v0.7.2 (oil-volume driven tank level)";',
              1,
          )

          old_render = '''  const state = String(this._state("oil_height_percent") ?? "").replace(",", ".");
            const pct = clamp(Number.parseFloat(state), 0, 100);

            const fill = ensureOilLevelElements(group);
            fill.setAttribute("d", buildOilLevelPath(Number.isFinite(pct) ? pct : 0));
            fill.style.display = pct > 0 ? "" : "none";'''
          new_render = '''  const state = String(this._state("oil_volume") ?? "").replace(",", ".");
            const volumeLiters = Number.parseFloat(state);
            const cfg = this._config || this.config || {};

            let capacityLiters = Number.parseFloat(
              String(cfg.oil_capacity_liters ?? cfg.oil_capacity ?? "").replace(",", ".")
            );

            if (!Number.isFinite(capacityLiters) || capacityLiters <= 0) {
              capacityLiters = Number(this.__oilCapacityLitersV072);
            }

            if ((!Number.isFinite(capacityLiters) || capacityLiters <= 0) && Number.isFinite(volumeLiters) && volumeLiters > 0) {
              const displayedPct = Number.parseFloat(
                String(this._state("oil_level") ?? "").replace(",", ".")
              );
              if (Number.isFinite(displayedPct) && displayedPct > 0 && displayedPct <= 100) {
                const inferred = volumeLiters * 100 / displayedPct;
                if (Number.isFinite(inferred) && inferred >= volumeLiters) {
                  this.__oilCapacityLitersV072 = inferred;
                  capacityLiters = inferred;
                }
              }
            }

            const volumePct = (
              Number.isFinite(volumeLiters) && volumeLiters > 0 &&
              Number.isFinite(capacityLiters) && capacityLiters > 0
            ) ? clamp(volumeLiters / capacityLiters * 100, 0, 100) : 0;
            const heightPct = volumePercentToHeightPercentV072(volumePct);

            const fill = ensureOilLevelElements(group);
            fill.setAttribute("d", buildOilLevelPath(heightPct));
            fill.style.display = heightPct > 0 ? "" : "none";'''
          if old_render not in wrapper:
              raise SystemExit('Expected v0.6.16 renderer block not found')
          wrapper = wrapper.replace(old_render, new_render, 1)

          insert_before = 'function renderOilLevelV072() {'
          volume_helper = '''function volumePercentToHeightPercentV072(percent) {
            const pct = clamp(Number(percent) || 0, 0, 100);
            if (pct <= 0) return 0;
            if (pct >= 100) return 100;

            const g = OIL_TANK;
            const step = 1;
            let totalArea = 0;
            for (let y = g.topY; y < g.bottomY; y += step) {
              const nextY = Math.min(g.bottomY, y + step);
              const width1 = Math.max(0, tankRightX(y) - tankLeftX(y));
              const width2 = Math.max(0, tankRightX(nextY) - tankLeftX(nextY));
              totalArea += ((width1 + width2) / 2) * (nextY - y);
            }

            const targetArea = totalArea * pct / 100;
            let accumulated = 0;
            for (let y = g.bottomY; y > g.topY; y -= step) {
              const nextY = Math.max(g.topY, y - step);
              const width1 = Math.max(0, tankRightX(y) - tankLeftX(y));
              const width2 = Math.max(0, tankRightX(nextY) - tankLeftX(nextY));
              const stripArea = ((width1 + width2) / 2) * (y - nextY);
              if (accumulated + stripArea >= targetArea) {
                const ratio = stripArea > 0 ? (targetArea - accumulated) / stripArea : 0;
                const liquidTopY = y - (y - nextY) * ratio;
                return clamp((g.bottomY - liquidTopY) / (g.bottomY - g.topY) * 100, 0, 100);
              }
              accumulated += stripArea;
            }
            return 100;
          }

          '''
          if insert_before not in wrapper:
              raise SystemExit('Expected v0.6.16 render function not found')
          wrapper = wrapper.replace(insert_before, volume_helper + insert_before, 1)

          wrapper = wrapper.replace(
              ' * - drive the visible liquid height from oil_height_percent\n',
              ' * - drive the visible liquid level from oil_volume / sensor.niveau_fioul\n',
              1,
          )
          wrapper = wrapper.replace(
              ' * - keep the tank click target on oil_height_percent\n',
              ' * - keep the existing tank click behavior unchanged\n',
              1,
          )

          standalone = (
              base.rstrip()
              + '\n\n/* ===== v0.7.2 oil-volume renderer, derived from validated v0.6.16 geometry ===== */\n'
              + '(() => {\n'
              + wrapper.strip()
              + '\n})();\n'
          )
          out_path.write_text(standalone, encoding='utf-8')

          readme = readme_path.read_text(encoding='utf-8')
          readme = re.sub(r'\*\*Current version: [^*]+\*\*', '**Current version: 0.7.2**', readme, count=1)
          readme = re.sub(
              r'/hacsfiles/lovelace-boiler-card/lovelace-boiler-card-v[^`\n]+\.js',
              '/hacsfiles/lovelace-boiler-card/lovelace-boiler-card-v0.7.2.js',
              readme,
              count=1,
          )
          readme = readme.replace(
              '- heating-oil tank with static full grey interior in this release; percentage and liters remain displayed,',
              '- heating-oil tank with a dynamic liquid level driven by `oil_volume` (`sensor.niveau_fioul` in the example); percentage and liters remain displayed,',
              1,
          )
          marker = 'oil_volume: sensor.niveau_fioul\n'
          capacity_note = (
              marker
              + '# Optional: explicit usable capacity in litres. If omitted, v0.7.2 auto-calibrates once from oil_level.\n'
              + '# oil_capacity_liters: 3000  # example only; replace with the actual usable capacity\n'
          )
          if marker in readme and '# oil_capacity_liters:' not in readme:
              readme = readme.replace(marker, capacity_note, 1)

          section = '''\n\n## v0.7.2 oil-volume tank level\n\n- remains a self-contained JavaScript resource based on v0.7.1;\n- drives the visible tank liquid from `oil_volume` (`sensor.niveau_fioul` in the example), not `oil_height_percent`;\n- reuses the validated v0.6.16 tank geometry and the v0.7.1 erase-mask approach;\n- converts the volume fraction into a physical liquid height using the rounded tank cross-section;\n- accepts optional `oil_capacity_liters` / `oil_capacity`; when absent, capacity is auto-calibrated once from the existing `oil_level`;\n- clamps the visual fill to 0-100% and keeps the suction tube above the liquid.\n'''
          if '## v0.7.2 oil-volume tank level' not in readme:
              readme += section
          readme_path.write_text(readme, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: node --check lovelace-boiler-card-v0.7.2.js

      - name: Commit generated v0.7.2
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lovelace-boiler-card-v0.7.2.js README.md
          git commit -m 'Add v0.7.2 oil-volume driven tank level'
          git push origin HEAD:release/v0.7.2-oil-volume-level
