name: Build v0.7.3 clean tank fill

on:
  push:
    branches:
      - release/v0.7.3-clean-tank-fill
    paths:
      - '.github/workflows/build-v073.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.7.3-clean-tank-fill
          fetch-depth: 0

      - name: Build and validate v0.7.3
        shell: bash
        run: |
          python3 .github/build_v073.py
          node --check lovelace-boiler-card-v0.7.3.js

      - name: Commit package and remove temporary tooling
        shell: bash
        run: |
          rm -f .github/build_v073.py .github/workflows/inspect-v073.yml .github/workflows/build-v073.yml
          git config user.name "adrien3287"
          git config user.email "78756933+adrien3287@users.noreply.github.com"
          git add -A
          git commit -m "Add v0.7.3 clean clipped oil tank fill"
          git push origin HEAD:release/v0.7.3-clean-tank-fill
