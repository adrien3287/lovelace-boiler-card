name: Build v0.7.4 tank fix

on:
  push:
    branches:
      - release/v0.7.4-tank-fill-resource
    paths:
      - '.github/workflows/build-v074.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.7.4-tank-fill-resource
          fetch-depth: 0

      - name: Build stable v0.7.4 runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('lovelace-boiler-card-v0.7.3.js')
          dst = Path('lovelace-boiler-card.js')
          text = src.read_text(encoding='utf-8')

          # Version bump inside the self-contained runtime.
          text = text.replace('v0.7.3', 'v0.7.4').replace('"0.7.3"', '"0.7.4"')

          # Keep the existing tank clip and oil-volume calculation. The v0.7.3
          # rectangle stopped at SVG y=739, although the actual clipped tank body
          # continues to about y=755. That caused the visible black strip at the base.
          top_expr = 'OIL_TANK.bottomY - ((OIL_TANK.bottomY - OIL_TANK.topY) * heightPct) / 100,'
          if top_expr not in text:
              raise SystemExit('v0.7.3 liquid-top expression not found')
          text = text.replace(
              top_expr,
              'OIL_TANK.bottomY - ((OIL_TANK.bottomY - OIL_TANK.topY) * heightPct) / 100 - 6,',
              1,
          )

          bottom_expr = 'formatNum(OIL_TANK.bottomY - liquidTopY + 1)'
          if bottom_expr not in text:
              raise SystemExit('v0.7.3 liquid-height expression not found')
          text = text.replace(bottom_expr, 'formatNum(755 - liquidTopY + 1)', 1)

          text = text.replace(
              '// Extend one pixel beyond the mathematical bottom; the tank clip trims it exactly.',
              '// Extend to the real clipped tank bottom; the existing tank clip trims the rounded base exactly.',
              1,
          )
          text = text.replace(
              'v0.7.4 (clean clipped oil-volume tank fill)',
              'v0.7.4 (calibrated clipped oil-volume tank fill)',
          )

          dst.write_text(text, encoding='utf-8')
          PY

          node --check lovelace-boiler-card.js
          git rm lovelace-boiler-card-v0.7.3.js
          git add lovelace-boiler-card.js
          git config user.name 'adrien3287'
          git config user.email '78756933+adrien3287@users.noreply.github.com'
          git commit -m 'Build v0.7.4 calibrated tank fill with stable runtime path'
          git push origin HEAD:release/v0.7.4-tank-fill-resource
