name: Finalize v0.7.4

on:
  push:
    branches:
      - release/v0.7.4-tank-fill-resource
    paths:
      - '.github/workflows/build-v074.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.7.4-tank-fill-resource
          fetch-depth: 0

      - name: Update docs and remove temporary workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('**Current version: 0.7.3**', '**Current version: 0.7.4**', 1)
          text = text.replace(
              '/hacsfiles/lovelace-boiler-card/lovelace-boiler-card-v0.7.3.js',
              '/hacsfiles/lovelace-boiler-card/lovelace-boiler-card.js',
              1,
          )
          text = text.replace(
              '1. update the versioned HACS entry point,',
              '1. keep the stable HACS entry point `lovelace-boiler-card.js`,',
              1,
          )
          if '## v0.7.4 calibrated tank fill and stable resource' not in text:
              text += '''\n\n## v0.7.4 calibrated tank fill and stable resource\n\n- extends the liquid rectangle to the real clipped bottom of the oil tank, removing the black strip left by v0.7.3;\n- nudges the liquid surface slightly upward to match the supplied reference image at the same measured volume;\n- keeps the existing tank clip, flat liquid surface, reference colour `#b97a57`, oil-volume calculation and suction tube unchanged;\n- switches HACS to the stable runtime name `lovelace-boiler-card.js` so future releases do not create a new resource URL each time.\n'''
          readme.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          entry = '''## 0.7.4\n\n- Fixes the remaining black strip at the bottom of the oil tank by extending the clipped liquid layer to the real tank bottom.\n- Moves the liquid surface slightly upward to match the supplied visual reference.\n- Keeps the existing tank clip, brown fill, oil-volume calculation and suction tube unchanged.\n- Uses stable HACS/runtime filename `lovelace-boiler-card.js` to avoid changing the dashboard resource URL on every release.\n\n'''
          if not text.startswith('## 0.7.4'):
              text = entry + text
          changelog.write_text(text, encoding='utf-8')
          PY

          node --check lovelace-boiler-card.js
          git rm .github/workflows/build-v074.yml
          git add README.md CHANGELOG.md hacs.json lovelace-boiler-card.js
          git config user.name 'adrien3287'
          git config user.email '78756933+adrien3287@users.noreply.github.com'
          git commit -m 'Finalize v0.7.4 tank fix and stable HACS resource'
          git push origin HEAD:release/v0.7.4-tank-fill-resource
