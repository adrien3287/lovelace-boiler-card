name: Build v0.8.1

on:
  push:
    branches:
      - release/v0.8.1-rectangular-gauge
    paths:
      - .github/workflows/build-v081.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build standalone v0.8.1 from validated v0.6.15
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, subprocess

          source_ref = "7fe7489779e6941e49a9645b7e2eea508d5d2c50"
          base = subprocess.check_output(["git", "show", f"{source_ref}:lovelace-boiler-card.js"], text=True)
          wrapper = subprocess.check_output(["git", "show", f"{source_ref}:lovelace-boiler-card-v0.6.15.js"], text=True)

          m = re.search(r'const EMPTY_TANK_ERASE_OVERLAY = ("data:image/png;base64,[^"]+");', wrapper)
          if not m:
              raise SystemExit("v0.6.15 erase overlay not found")
          erase_overlay = m.group(1)

          base = base.replace('const BOILER_CARD_VERSION = "0.6.9";', 'const BOILER_CARD_VERSION = "0.8.1";')

          patch = f'''\n\n/*
           * Lovelace Boiler Card v0.8.1
           * Starts from the validated v0.6.15 visual/runtime baseline.
           * The oil tank interior is static. Only the rectangular gauge is dynamic.
           */
          (() => {{
            const BoilerCardClass = customElements.get("lovelace-boiler-card");
            if (!BoilerCardClass) {{
              throw new Error("lovelace-boiler-card: v0.6.15 base did not register the card");
            }}

            const SVG_NS = "http://www.w3.org/2000/svg";
            const EMPTY_TANK_ERASE_OVERLAY = {erase_overlay};
            const STATIC_TANK_FILL = "#9d001f";

            const GAUGE = Object.freeze({{
              x: 112,
              y: 423,
              width: 24,
              height: 282,
              innerX: 117,
              innerY: 428,
              innerWidth: 14,
              innerHeight: 272,
            }});

            const ensureV081OilDrawing = function () {{
              const group = this.shadowRoot?.getElementById("obj-oil-level");
              if (!group) return null;

              const originalFill = this.shadowRoot?.getElementById("oil-fill");
              if (originalFill) {{
                originalFill.setAttribute("height", "0");
                originalFill.style.display = "none";
              }}

              const tube = Array.from(group.querySelectorAll("path")).find(
                (el) => el.getAttribute("d") === "M190 401 V748 M179 748 H201"
              );
              const anchor = tube || group.querySelector(".hotspot") || null;

              let erase = group.querySelector("#oil-empty-erase-overlay-v081");
              if (!erase) {{
                erase = document.createElementNS(SVG_NS, "image");
                erase.setAttribute("id", "oil-empty-erase-overlay-v081");
                erase.setAttribute("x", "58");
                erase.setAttribute("y", "452");
                erase.setAttribute("width", "261");
                erase.setAttribute("height", "314");
                erase.setAttribute("href", EMPTY_TANK_ERASE_OVERLAY);
                erase.setAttribute("pointer-events", "none");
                group.insertBefore(erase, anchor);
              }}

              let tankFill = group.querySelector("#oil-static-tank-v081");
              if (!tankFill) {{
                tankFill = document.createElementNS(SVG_NS, "rect");
                tankFill.setAttribute("id", "oil-static-tank-v081");
                tankFill.setAttribute("x", "66");
                tankFill.setAttribute("y", "397");
                tankFill.setAttribute("width", "238");
                tankFill.setAttribute("height", "342");
                tankFill.setAttribute("clip-path", "url(#oil-tank-clip)");
                tankFill.setAttribute("fill", STATIC_TANK_FILL);
                tankFill.setAttribute("opacity", "1");
                tankFill.setAttribute("pointer-events", "none");
                group.insertBefore(tankFill, anchor);
              }}

              let gaugeGroup = group.querySelector("#oil-rect-gauge-v081");
              if (!gaugeGroup) {{
                gaugeGroup = document.createElementNS(SVG_NS, "g");
                gaugeGroup.setAttribute("id", "oil-rect-gauge-v081");
                gaugeGroup.setAttribute("pointer-events", "none");

                const frame = document.createElementNS(SVG_NS, "rect");
                frame.setAttribute("x", String(GAUGE.x));
                frame.setAttribute("y", String(GAUGE.y));
                frame.setAttribute("width", String(GAUGE.width));
                frame.setAttribute("height", String(GAUGE.height));
                frame.setAttribute("fill", "#f2f2f2");
                frame.setAttribute("stroke", "#ffffff");
                frame.setAttribute("stroke-width", "3");
                gaugeGroup.appendChild(frame);

                const gaugeFill = document.createElementNS(SVG_NS, "rect");
                gaugeFill.setAttribute("id", "oil-gauge-fill-v081");
                gaugeFill.setAttribute("x", String(GAUGE.innerX));
                gaugeFill.setAttribute("y", String(GAUGE.innerY + GAUGE.innerHeight));
                gaugeFill.setAttribute("width", String(GAUGE.innerWidth));
                gaugeFill.setAttribute("height", "0");
                gaugeFill.setAttribute("fill", "#ffc000");
                gaugeGroup.appendChild(gaugeFill);

                const labels = [
                  ["100%", GAUGE.y + 8],
                  ["50%", GAUGE.y + GAUGE.height / 2 + 5],
                  ["0%", GAUGE.y + GAUGE.height + 2],
                ];
                for (const [label, y] of labels) {{
                  const text = document.createElementNS(SVG_NS, "text");
                  text.setAttribute("x", String(GAUGE.x + GAUGE.width + 8));
                  text.setAttribute("y", String(y));
                  text.setAttribute("fill", "#d9c2c7");
                  text.setAttribute("font-size", "14");
                  text.setAttribute("font-weight", "600");
                  text.setAttribute("dominant-baseline", "middle");
                  text.textContent = label;
                  gaugeGroup.appendChild(text);
                }}

                group.insertBefore(gaugeGroup, anchor);
              }}

              return gaugeGroup.querySelector("#oil-gauge-fill-v081");
            }};

            BoilerCardClass.prototype._updateOilFill = function () {{
              const gaugeFill = ensureV081OilDrawing.call(this);
              if (!gaugeFill) return;

              const state = String(this._state("oil_height_percent") ?? "").replace(",", ".");
              const raw = Number.parseFloat(state);
              const pct = Number.isFinite(raw) ? Math.max(0, Math.min(100, raw)) : 0;

              const fillH = (GAUGE.innerHeight * pct) / 100;
              const bottom = GAUGE.innerY + GAUGE.innerHeight;
              gaugeFill.setAttribute("y", String(bottom - fillH));
              gaugeFill.setAttribute("height", String(fillH));
            }};

            if (Array.isArray(window.customCards)) {{
              const entry = window.customCards.find((card) => card.type === "lovelace-boiler-card");
              if (entry) {{
                entry.description = "Oil boiler + radiator circuit + DHW tank. v0.8.1 rectangular oil gauge";
              }}
            }}
          }})();\n'''

          Path("lovelace-boiler-card-v0.8.1.js").write_text(base.rstrip() + patch, encoding="utf-8")

          hacs = {"name": "Lovelace Boiler Card", "filename": "lovelace-boiler-card-v0.8.1.js", "render_readme": True}
          Path("hacs.json").write_text(json.dumps(hacs, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          readme = Path("README.md").read_text(encoding="utf-8")
          readme = re.sub(r'\*\*Current version: [^*]+\*\*', '**Current version: 0.8.1**', readme, count=1)
          readme = re.sub(r'/hacsfiles/lovelace-boiler-card/lovelace-boiler-card-v[^`\n]+\.js', '/hacsfiles/lovelace-boiler-card/lovelace-boiler-card-v0.8.1.js', readme)
          section = '''\n\n## v0.8.1 static oil tank + rectangular gauge\n\n- restarts from the validated v0.6.15 visual/runtime baseline;\n- the tank interior is filled statically and no longer changes shape with the oil level;\n- only a simple rectangular gauge inside the tank displays the dynamic level;\n- the gauge is driven by `oil_height_percent`;\n- the displayed percentage and litres remain unchanged;\n- the validated suction tube and the rest of the card layout are unchanged;\n- the gauge update only changes two SVG attributes (`y` and `height`) and does not reorder/rebuild the DOM on every Home Assistant state refresh.\n'''
          if "## v0.8.1 static oil tank + rectangular gauge" not in readme:
              readme = readme.rstrip() + section + "\n"
          Path("README.md").write_text(readme, encoding="utf-8")

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          entry = '''## 0.8.1\n\n- Restarts from the validated v0.6.15 visual/runtime baseline.\n- Replaces the dynamic rounded tank fill with a static full tank interior.\n- Adds a rectangular 0/50/100% gauge inside the tank.\n- Only the yellow gauge bar changes with `oil_height_percent`.\n- Keeps the validated suction tube and all unrelated visuals unchanged.\n- Avoids DOM reordering during state updates; only the gauge `y`/`height` attributes change.\n\n'''
          if not changelog.startswith("## 0.8.1"):
              changelog = entry + changelog
          Path("CHANGELOG.md").write_text(changelog, encoding="utf-8")
          PY

      - name: Validate JavaScript
        run: node --check lovelace-boiler-card-v0.8.1.js

      - name: Commit generated v0.8.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lovelace-boiler-card-v0.8.1.js hacs.json README.md CHANGELOG.md
          git commit -m "Build v0.8.1 static tank with rectangular gauge" || exit 0
          git push
