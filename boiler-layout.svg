<svg viewBox="0 0 1200 600" role="img" aria-label="Oil boiler installation" preserveAspectRatio="xMidYMid meet"><style>
:root{--hot:#ff263e;--cold:#2498e8;--oil:#ffc000;--metal:#777;--text:#ddd;--bg:#202020}
.hot{stroke:var(--hot);fill:none;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.cold{stroke:var(--cold);fill:none;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.arrow-hot,.arrow-cold{fill:#252525}.boiler-outline{stroke:var(--metal);fill:none}.boiler-normal{color:var(--metal)}
.pump-off{color:#d7d7d7}.pump-shape{fill:currentColor}.flame-burning{color:#e53935}.flame-shape{fill:currentColor}
.heater-disabled{color:#969696}.heater-box{stroke:currentColor;fill:var(--bg);stroke-width:5}.heater-bolt{fill:currentColor}.heater-tube{stroke:currentColor;fill:none;stroke-width:8;stroke-linecap:round}
</style>
