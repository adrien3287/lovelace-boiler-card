<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#111;color:#eee;font-family:Roboto,Arial,sans-serif;padding:20px} lovelace-boiler-card{display:block;max-width:1500px;margin:auto}
</style></head><body>
<script>
customElements.define('ha-card', class extends HTMLElement {connectedCallback(){this.style.display='block';this.style.background='#202020';this.style.borderRadius='12px';this.style.boxShadow='0 2px 8px #0008';}});
</script>
<script src="./lovelace-boiler-card.js"></script>
<lovelace-boiler-card id="card"></lovelace-boiler-card>
<script>
const c=document.getElementById('card');
c.setConfig({

 'binary_sensor.dp':{state:'on',attributes:{}}, 'sensor.top':{state:'54.8',attributes:{unit_of_measurement:'°C'}}, 'sensor.mid':{state:'43.7',attributes:{unit_of_measurement:'°C'}}, 'sensor.bot':{state:'31.3',attributes:{unit_of_measurement:'°C'}}, 'sensor.dtarget':{state:'50.0',attributes:{unit_of_measurement:'°C'}},
 'input_select.statut_resistance':{state:'Chauffe',attributes:{}}
}};
</script></body></html>
